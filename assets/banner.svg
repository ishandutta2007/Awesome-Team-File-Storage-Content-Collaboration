<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12.5px;
        fill: #e2e8f0;
      }
      .grid-line {
        stroke: #334155;
        stroke-opacity: 0.2;
        stroke-width: 1;
      }

      /* Animated dynamic background orbs and pulses */
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(50px, 25px) scale(1.15); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        50% { transform: translate(-45px, -20px) scale(0.95); }
        100% { transform: translate(0px, 0px) scale(1.1); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 7px; opacity: 0.9; }
      }
      @keyframes cardFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .animated-orb1 {
        animation: floatOrb1 16s ease-in-out infinite;
      }
      .animated-orb2 {
        animation: floatOrb2 20s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 10, 10;
        animation: flowLine 25s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .floating-card-1 {
        animation: cardFloat 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: cardFloat 6s ease-in-out infinite 1.5s;
      }
      .floating-card-3 {
        animation: cardFloat 5.5s ease-in-out infinite 3s;
      }
      .floating-card-4 {
        animation: cardFloat 6.2s ease-in-out infinite 2s;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-rect" rx="16"/>

  <!-- Subtle Architectural Grid Behind All Text -->
  <g opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="360" class="grid-line" />
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  </g>

  <!-- Dynamic Animated Glow Orbs (Layered strictly in deep background) -->
  <g>
    <circle cx="160" cy="110" r="170" fill="url(#glowGrad1)" class="animated-orb1" />
    <circle cx="1040" cy="240" r="220" fill="url(#glowGrad2)" class="animated-orb2" />
  </g>

  <!-- Dynamic Data Stream Vectors (Subtle in Background) -->
  <g opacity="0.25">
    <path d="M 60 40 C 300 20, 450 180, 750 120 S 1080 300, 1160 320" fill="none" stroke="#38bdf8" stroke-width="2" class="data-stream" />
    <path d="M 40 320 C 260 280, 520 200, 840 250 S 1040 60, 1160 40" fill="none" stroke="#a855f7" stroke-width="1.5" class="data-stream" style="animation-direction: reverse; animation-duration: 35s;" />
  </g>

  <!-- Interactive Dynamic Background Node Elements -->
  <circle cx="340" cy="50" r="4" fill="#38bdf8" class="node-pulse" />
  <circle cx="890" cy="65" r="5" fill="#a855f7" class="node-pulse" style="animation-delay: 1s;" />
  <circle cx="140" cy="300" r="5" fill="#0284c7" class="node-pulse" style="animation-delay: 2s;" />
  <circle cx="1070" cy="110" r="5" fill="#818cf8" class="node-pulse" style="animation-delay: 1.5s;" />

  <!-- Dynamic Ambient Feature Badges (Positioned strictly below the title/subtitle) -->
  <g class="floating-card-1">
    <g transform="translate(100, 280)">
      <rect width="220" height="40" rx="20" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="24" cy="20" r="6" fill="#38bdf8"/>
      <text x="40" y="25" class="tag-text">Enterprise File Sync &amp; Share</text>
    </g>
  </g>

  <g class="floating-card-2">
    <g transform="translate(345, 280)">
      <rect width="235" height="40" rx="20" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="24" cy="20" r="6" fill="#818cf8"/>
      <text x="40" y="25" class="tag-text">Content Collaboration (CCP)</text>
    </g>
  </g>

  <g class="floating-card-3">
    <g transform="translate(605, 280)">
      <rect width="250" height="40" rx="20" fill="url(#pillGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="24" cy="20" r="6" fill="#c084fc"/>
      <text x="40" y="25" class="tag-text">Self-Hosted / Data Sovereignty</text>
    </g>
  </g>

  <g class="floating-card-4">
    <g transform="translate(880, 280)">
      <rect width="220" height="40" rx="20" fill="url(#pillGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="24" cy="20" r="6" fill="#34d399"/>
      <text x="40" y="25" class="tag-text">Real-Time Office Co-Editing</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle (Layered strictly on top, crystal clear readability) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Category Indicator -->
    <g transform="translate(445, 38)">
      <rect width="310" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="15" r="4" fill="#38bdf8" />
      <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" letter-spacing="1">CURATED ARCHITECTURE DIRECTORY</text>
    </g>

    <!-- Main Title (Centered in clear foreground space) -->
    <text x="600" y="140" text-anchor="middle" class="title-text">Team File Storage &amp; Content Collaboration</text>

    <!-- Subtitle (Centered in clear foreground space) -->
    <text x="600" y="190" text-anchor="middle" class="subtitle-text">Curated Directory of Cloud EFSS Platforms, Self-Hosted Drives &amp; Collaborative Workspaces</text>
    <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#64748b" font-weight="500">Comparing Commercial SaaS Giants and Sovereign Open-Source File Sync Engines</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
